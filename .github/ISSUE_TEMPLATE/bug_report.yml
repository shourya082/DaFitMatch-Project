name: Bug report
description: Report a reproducible problem with DaFitMatch
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove personal information and credentials from all details, logs, and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional. Remove personal data and secrets first.
    validations:
      required: false